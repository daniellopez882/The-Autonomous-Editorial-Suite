name: CI

# The previous pipeline had two problems:
#
#   * the test step carried `continue-on-error: true`, so a failing suite could
#     never fail the build -- and with no tests in a tests/ directory, pytest
#     exited 5 ("no tests collected"), which the same flag hid;
#   * the only gate that could actually fail was `black --check`, and it was
#     failing on main across 12 files.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Formatting
        # ruff format, not black. Both were configured and they disagree across
        # versions -- CI went red on a file that was clean locally because the
        # pinned black major differed from the one installed for development.
        run: ruff format --check .

      - name: Tests
        # No continue-on-error: a failing suite fails the build.
        env:
          ENVIRONMENT: testing
        run: pytest -q

      - name: Fail if no tests were collected
        run: |
          out=$(pytest --collect-only -q 2>&1 | tail -1)
          echo "collected: $out"
          if echo "$out" | grep -qiE "no tests ran|^0 tests"; then
            echo "::error::pytest collected no tests"
            exit 1
          fi

      - name: The auth tests must actually run, not skip
        # They are the ones covering the cookie signing key. streamlit is a
        # declared runtime dependency, so if they skip here the install is
        # broken and the security tests are silently not running.
        run: |
          out=$(pytest tests/test_auth.py -q 2>&1 | tail -2)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::auth tests skipped; streamlit missing from the environment"
            exit 1
          fi

      - name: No committed signing key may be used as a default
        # The auth cookie used to be signed with a value committed to this repo.
        #
        # Matches the placeholder being *used* as a getenv default, not merely
        # named. auth.py defines it as the constant to reject and the tests
        # assert against it; an earlier, looser pattern also matched this
        # workflow file itself.
        run: |
          hits=$(grep -rIn --exclude-dir=.git --exclude-dir=.venv \
                   --exclude-dir=.github --exclude-dir=tests --exclude=auth.py \
                   -E 'getenv\([^)]*,[[:space:]]*"[^"]*secret[^"]*"\)' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a hardcoded signing key is being used as a default"
            exit 1
          fi
          echo "clean"

      - name: Bandit
        run: bandit -r . -x ./tests,./.venv -ll -f screen
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: editorial-suite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
