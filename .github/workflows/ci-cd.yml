name: CI

# The previous pipeline had two problems:
#
#   * the test step carried `continue-on-error: true`, so a failing suite could
#     never fail the build -- and with no tests in a tests/ directory, pytest
#     exited 5 ("no tests collected"), which the same flag hid;
#   * the only gate that could actually fail was `black --check`, and it was
#     failing on main across 12 files.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Formatting
        # ruff format, not black. Both were configured and they disagree across
        # versions -- CI went red on a file that was clean locally because the
        # pinned black major differed from the one installed for development.
        run: ruff format --check .

      - name: Tests
        # No continue-on-error: a failing suite fails the build.
        env:
          ENVIRONMENT: testing
        run: pytest -q

      - name: Fail if no tests were collected
        run: |
          out=$(pytest --collect-only -q 2>&1 | tail -1)
          echo "collected: $out"
          if echo "$out" | grep -qiE "no tests ran|^0 tests"; then
            echo "::error::pytest collected no tests"
            exit 1
          fi

      - name: The auth tests must actually run, not skip
        # They are the ones covering the cookie signing key. streamlit is a
        # declared runtime dependency, so if they skip here the install is
        # broken and the security tests are silently not running.
        run: |
          out=$(pytest tests/test_auth.py -q 2>&1 | tail -2)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::auth tests skipped; streamlit missing from the environment"
            exit 1
          fi

      - name: No committed signing key may be used as a default
        # The auth cookie used to be signed with a value committed to this repo.
        #
        # Matches the placeholder being *used* as a getenv default, not merely
        # named. auth.py defines it as the constant to reject and the tests
        # assert against it; an earlier, looser pattern also matched this
        # workflow file itself.
        run: |
          hits=$(grep -rIn --exclude-dir=.git --exclude-dir=.venv \
                   --exclude-dir=.github --exclude-dir=tests --exclude-dir=docs \
                   --exclude=auth.py --exclude=README.md \
                   -E 'getenv\([^)]*,[[:space:]]*"[^"]*secret[^"]*"\)' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a hardcoded signing key is being used as a default"
            exit 1
          fi
          echo "clean"

      - name: Bandit
        run: bandit -q -r . -x ./tests,./.venv -ll

      - name: Dependency audit
        run: pip-audit --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: editorial-suite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Production start without a password is refused
        # The entrypoint runs preflight.py before streamlit. This is the case
        # the login gate used to accept: admin / admin.
        run: |
          if docker run --rm --entrypoint python -e ENVIRONMENT=production -e APP_SECRET_KEY=ci-secret-not-real editorial-suite:ci preflight.py; then
            echo "::error::a production start without APP_PASSWORD was accepted"; exit 1
          fi
          echo "refused, as it should be"

      - name: Container boots and serves its health check
        run: |
          docker run -d --name es-ci -p 8501:8501 \
            -e ENVIRONMENT=production -e APP_SECRET_KEY=ci-secret-not-real -e APP_PASSWORD=ci-password-not-real \
            editorial-suite:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; curl -fsS http://localhost:8501/_stcore/health; echo; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"; docker logs es-ci; exit 1

      - name: The login page renders, not a traceback
        # Without DEEPSEEK_API_KEY the old app died importing the crew. The
        # Streamlit shell must be served and the process must still be running.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/)
          echo "GET / -> $code"
          [ "$code" = "200" ] || exit 1
          docker logs es-ci 2>&1 | grep -qi "traceback" && { echo "::error::the app logged a traceback at startup"; docker logs es-ci; exit 1; } || true
          docker logs es-ci 2>&1 | grep -q "preflight: production; authentication enabled" || { echo "::error::preflight did not run"; docker logs es-ci; exit 1; }

      - name: Image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh editorial-suite:ci -c 'id -u')
          echo "runs as uid $uid"
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Clean up
        if: always()
        run: docker rm -f es-ci || true
