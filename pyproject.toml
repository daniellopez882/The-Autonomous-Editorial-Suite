[project]
name = "editorial-suite"
version = "1.0.0"
description = "Autonomous editorial pipeline for long-form content."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Manual smoke-test scripts. Asserts are how they report, and verify_imports.py
# imports names precisely to check that importing them works.
"scripts/**" = ["S101", "F401", "T201", "I001"]

[tool.ruff.format]
quote-style = "double"
